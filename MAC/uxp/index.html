<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
  <h2>WINDOWMASK <small>BY MYSTIC</small></h2>
  <p>Chọn một layer ảnh để tạo soft mask.</p>
  <label>License Key</label><input id="key" type="password" placeholder="Nhập License Key">
  <div class="row"><button id="activate">Kích hoạt</button><button id="deactivate">Huỷ kích hoạt</button></div>
  <button id="connect">Kết nối backend</button>
  <button id="create" disabled>TẠO SOFT MASK</button>
  <button id="retry" hidden>Gắn lại mask đã tạo</button>
  <p id="status" role="status">Đang kết nối…</p>
  <script src="index.js"></script>
</body></html>
