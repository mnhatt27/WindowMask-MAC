name: Verify built Mac DMG

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful package job's workflow run ID
        required: true
        type: string
      source_ref:
        description: Source commit containing verification tests
        required: true
        type: string
      runner:
        description: Native macOS runner
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel, macos-26-intel]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: WindowMask-Mac-1.1.3
          path: dist
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Install and test the exact existing DMG
        run: python MAC/tests/test_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-existing-dmg-${{ inputs.runner }}
          path: dist/installed-*.json
          if-no-files-found: error
